<!DOCTYPE html>

<html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 30px 20px;
        color: #f1f5f9;
        background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                    url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1350&q=80') center/cover fixed no-repeat;
    }

 
    h1 {
        text-align: center;
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 25px;
        color: #38bdf8;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        letter-spacing: 1px;
    }

    fieldset {
        border: 2px solid #3b82f6;
        border-radius: 8px;
        margin-bottom: 25px;
        padding: 20px 25px 25px 25px;
        background-color: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    legend {
        font-weight: 700;
        font-size: 1rem;
        padding: 4px 14px;
        margin: 0 auto;
        text-transform: uppercase;
        color: #0f172a;
        background-color: #38bdf8;
        border-radius: 20px;
        letter-spacing: 1px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #e2e8f0;
        font-size: 0.95rem;
    }

    input[type="text"],
    textarea {
        width: 100%;
        max-width: 360px;
        padding: 8px 12px;
        border: 1px solid #475569;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
        background-color: #0f172a;
        color: #f8fafc;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
        border-color: #38bdf8;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    textarea {
        max-width: 100%;
        height: 90px;
        resize: vertical;
    }

    .section-title {
        font-weight: 600;
        margin-top: 20px;
        margin-bottom: 10px;
        color: #c084fc;
        font-size: 1rem;
    }

    .option-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 400;
        color: #cbd5e1;
        cursor: pointer;
    }

    .option-group input {
        accent-color: #c084fc;
        width: 16px;
        height: 16px;
        cursor: pointer;
    }

    /* Centered Submit and Clear Buttons */
    .button-group {
        text-align: center;
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .button-group input[type="submit"],
    .button-group input[type="reset"] {
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
    }

    .button-group input[type="submit"] {
        background-color: #38bdf8;
        color: #0f172a;
    }

    .button-group input[type="submit"]:hover {
        background-color: #7dd3fc;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        transform: translateY(-1px);
    }

    .button-group input[type="reset"] {
        background-color: #64748b;
        color: #ffffff;
    }

    .button-group input[type="reset"]:hover {
        background-color: #94a3b8;
        box-shadow: 0 0 12px rgba(148, 163, 184, 0.3);
        transform: translateY(-1px);
    }
</style>
